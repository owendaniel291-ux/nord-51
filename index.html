<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--black:#000;--white:#fff;--g1:#f3f3f3;--g2:#e2e2e2;--g3:#bdbdbd;--g5:#767676;--red:#d7261e;--f:"Archivo","Helvetica Neue",Arial,sans-serif;--ease:cubic-bezier(.22,.8,.22,1);--pad:clamp(.9rem,2.6vw,2.2rem)}
*,*::before,*::after{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:400 .95rem/1.5 var(--f);color:var(--black);background:var(--white);-webkit-font-smoothing:antialiased}body.lock{overflow:hidden}
img{max-width:100%;display:block}a{color:inherit}button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--black);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;padding-inline:var(--pad)}
.up{text-transform:uppercase}.muted{color:var(--g5)}.sm{font-size:.84rem}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:.5rem;background:var(--black);color:#fff;border:2px solid var(--black);padding:.95rem 1.6rem;font:800 .85rem var(--f);font-stretch:100%;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;transition:background .25s,color .25s}
.btn:hover{background:#fff;color:#000}.btn.w{background:#fff;color:#000;border-color:#fff}.btn.w:hover{background:#000;color:#fff}.btn.o{background:#fff;color:#000}.btn.o:hover{background:#000;color:#fff}.btn.block{width:100%}.btn[disabled]{opacity:.4;pointer-events:none}
/* en-tête */
.top{background:#000;color:#fff;text-align:center;font:600 .78rem var(--f);padding:.55rem var(--pad);display:flex;justify-content:center;gap:2rem;flex-wrap:wrap}
header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--g2)}
.hbar{display:grid;grid-template-columns:auto 1fr auto;gap:1.2rem;align-items:center;padding:.8rem var(--pad);max-width:1480px;margin:auto}
.logo{font:900 1.7rem/1 var(--f);font-stretch:75%;letter-spacing:.01em;text-transform:uppercase;text-decoration:none}
.search{position:relative;max-width:560px;width:100%;justify-self:center}.search input{width:100%;padding:.75rem 1rem .75rem 2.6rem;border:2px solid var(--g2);background:var(--g1);font:inherit;border-radius:0}.search input:focus{outline:none;border-color:#000;background:#fff}
.search svg{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);width:1.15rem;height:1.15rem}
.ico{display:flex;gap:.2rem}.ib{position:relative;display:grid;place-items:center;width:2.8rem;height:2.8rem;text-decoration:none}.ib svg{width:1.4rem;height:1.4rem}.ib span.n{position:absolute;top:.1rem;right:.05rem;background:#000;color:#fff;font:700 .66rem/1.15rem var(--f);min-width:1.15rem;height:1.15rem;border-radius:99px;text-align:center}.ib span.n:empty{display:none}
svg.i{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.burger{display:none}
nav.cats{border-top:1px solid var(--g2)}nav.cats ul{list-style:none;margin:0 auto;padding:0 var(--pad);max-width:1480px;display:flex;gap:1.6rem;overflow-x:auto;scrollbar-width:none}
nav.cats a{display:block;padding:.85rem 0;font:800 .8rem var(--f);letter-spacing:.05em;text-transform:uppercase;text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent}nav.cats a:hover,nav.cats a.on{border-color:#000}nav.cats a.red{color:var(--red)}
/* bannière */
.hero{position:relative;background:#000 center/cover;color:#fff;min-height:clamp(380px,62vh,640px);display:flex;align-items:flex-end;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.65),rgba(0,0,0,.05) 70%)}
.hero.no{background:repeating-linear-gradient(115deg,#000 0 38px,#0d0d0d 38px 76px)}
.hero .in{position:relative;padding:clamp(1.5rem,5vw,4rem) var(--pad);max-width:1480px;margin:auto;width:100%;display:grid;gap:1.2rem;justify-items:start}
.hero h1{font:900 clamp(3.2rem,12vw,9.5rem)/.85 var(--f);font-stretch:62%;text-transform:uppercase;letter-spacing:-.005em;max-width:11ch;animation:rise .9s var(--ease) both}
.hero p{max-width:44ch;color:#e7e7e7;font-size:1.05rem;animation:rise .9s .15s var(--ease) both}.hero .btn{animation:rise .9s .3s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-top:.8rem}
.tile{position:relative;aspect-ratio:16/9;background:#161616 center/cover;color:#fff;display:flex;align-items:flex-end;padding:1.2rem;text-decoration:none;overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent 60%)}.tile b{position:relative;z-index:1;font:900 clamp(1.4rem,2.6vw,2.3rem)/.95 var(--f);font-stretch:70%;text-transform:uppercase}.tile:nth-child(2){background-color:#2b2b2b}.tile:nth-child(3){background-color:#555}
.tile:hover b{text-decoration:underline;text-underline-offset:.2em}
section.s{padding-top:clamp(2rem,5vw,3.8rem)}.sh{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:1.1rem}.sh h2{font:900 clamp(1.7rem,3.4vw,2.7rem)/1 var(--f);font-stretch:75%;text-transform:uppercase}.sh a{font-weight:700;font-size:.85rem}
.chips{display:flex;gap:.7rem;overflow-x:auto;scrollbar-width:none;padding-bottom:.4rem}.chip{flex:none;border:2px solid var(--g2);padding:.7rem 1.3rem;font:800 .82rem var(--f);text-transform:uppercase;letter-spacing:.04em;text-decoration:none;transition:.2s}.chip:hover,.chip.on{background:#000;color:#fff;border-color:#000}
.scroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,19%);gap:.9rem;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin;padding-bottom:.8rem}.scroll>*{scroll-snap-align:start}
.brandrow{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem}.brandrow a{display:grid;place-items:center;aspect-ratio:3/1.4;background:var(--g1);font:900 clamp(1.1rem,2.2vw,1.8rem) var(--f);font-stretch:70%;text-transform:uppercase;text-decoration:none;transition:.25s}.brandrow a:hover{background:#000;color:#fff}
/* produits */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.4rem .9rem}
.card{position:relative;display:block;text-decoration:none}.ph{position:relative;aspect-ratio:4/5;background:var(--g1);overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}.card:hover .ph img{transform:scale(1.05)}
.ph .fake{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:1rem;font:900 1.5rem/1 var(--f);font-stretch:62%;text-transform:uppercase;color:rgba(0,0,0,.14)}
.tags{position:absolute;left:.5rem;top:.5rem;display:flex;gap:.3rem;flex-wrap:wrap}.tg{background:#000;color:#fff;font:800 .64rem var(--f);letter-spacing:.06em;text-transform:uppercase;padding:.25rem .5rem}.tg.r{background:var(--red)}.tg.w{background:#fff;color:#000}
.fav{position:absolute;right:.4rem;top:.4rem;width:2.3rem;height:2.3rem;display:grid;place-items:center;background:#fff;border-radius:50%}.fav svg{width:1.1rem;height:1.1rem}.fav.on svg{fill:#000}
.ci{padding:.6rem .1rem 0}.ci .b{font:800 .72rem var(--f);text-transform:uppercase;letter-spacing:.05em;color:var(--g5)}.ci h3{font:600 .92rem/1.3 var(--f)}.pr{font-weight:800;margin-top:.15rem}.pr s{color:var(--g5);font-weight:400;margin-left:.4rem}.pr .red{color:var(--red)}.sz{font-size:.76rem;color:var(--g5);margin-top:.15rem}.fs{font-size:.76rem;font-weight:700;margin-top:.1rem}
.ph-h{padding:1.8rem 0 1rem}.ph-h h1{font:900 clamp(2.2rem,6vw,4.4rem)/.95 var(--f);font-stretch:68%;text-transform:uppercase}
.tb{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;padding:.8rem 0;border-block:1px solid var(--g2);margin-bottom:1.2rem}.tb select{padding:.55rem .8rem;border:2px solid var(--g2);font:inherit;background:#fff;border-radius:0}.sizes{display:flex;gap:.35rem;flex-wrap:wrap}.sz-b{min-width:2.8rem;padding:.5rem .6rem;border:2px solid var(--g2);font-weight:700;font-size:.82rem;text-align:center}.sz-b:hover{border-color:#000}.sz-b.on{background:#000;color:#fff;border-color:#000}
.pd{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(1.2rem,4vw,3.5rem);padding:1.5rem 0 3rem}.pd .ph{aspect-ratio:4/5}.pd h1{font:800 clamp(1.5rem,3vw,2.2rem)/1.1 var(--f)}.pd .pr{font-size:1.5rem;margin:.6rem 0 1rem}.info{display:grid;gap:1rem;align-content:start}
details.acc{border-top:1px solid var(--g2)}details.acc:last-child{border-bottom:1px solid var(--g2)}details.acc summary{padding:.9rem 0;font-weight:800;text-transform:uppercase;font-size:.8rem;letter-spacing:.05em;cursor:pointer;list-style:none;display:flex;justify-content:space-between}details.acc summary::after{content:"+"}details.acc[open] summary::after{content:"–"}details.acc div{padding:0 0 1rem;color:#333}
.crumb{font-size:.8rem;color:var(--g5);padding-top:1rem}.crumb a{text-decoration:none}.crumb a:hover{text-decoration:underline}
.rea{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;border-block:1px solid var(--g2);margin-top:clamp(2.5rem,6vw,4rem);padding:1.4rem 0}.rea div{display:flex;gap:.8rem;align-items:center;font-size:.86rem}.rea svg{width:1.7rem;height:1.7rem;flex:none}.rea b{display:block;font-weight:800}
.news{background:#000;color:#fff;margin-top:clamp(2.5rem,6vw,4rem);padding:clamp(2rem,5vw,3.5rem) 0}.news .wrap{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center}.news h2{font:900 clamp(1.8rem,4vw,3rem)/.95 var(--f);font-stretch:70%;text-transform:uppercase}.news form{display:grid;gap:.6rem}.news .r{display:flex}.news input[type=email]{flex:1;padding:.9rem 1rem;border:2px solid #fff;background:#000;color:#fff;font:inherit;border-radius:0}.news .r .btn{border-color:#fff}.news label{display:flex;gap:.5rem;font-size:.8rem;color:#ccc}
footer{background:var(--g1);padding:2.5rem 0 1.5rem}.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:2rem}.fg h4{margin:0 0 .8rem;font:800 .8rem var(--f);text-transform:uppercase;letter-spacing:.05em}.fg ul{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}.fg a{text-decoration:none;color:#333}.fg a:hover{text-decoration:underline}
.pay{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.8rem}.pay span{background:#fff;border:1px solid var(--g3);padding:.25rem .6rem;font:800 .72rem var(--f);text-transform:uppercase}.legal{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--g3);color:var(--g5);font-size:.8rem}
/* panneaux */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:.35s;z-index:50}body.veil #veil{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;bottom:0;width:min(430px,100vw);background:#fff;z-index:60;display:flex;flex-direction:column;transition:transform .45s var(--ease),visibility 0s .45s;visibility:hidden}
#cart{right:0;transform:translateX(102%)}#menu{left:0;transform:translateX(-102%)}body.cart #cart,body.menu #menu{transform:none;visibility:visible;transition:transform .45s var(--ease)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--g2)}.dh h2{font:900 1.5rem var(--f);font-stretch:70%;text-transform:uppercase}.db{flex:1;overflow:auto;padding:.6rem 1.2rem}.df{padding:1rem 1.2rem;border-top:1px solid var(--g2);background:var(--g1);display:grid;gap:.6rem}
.ln{display:grid;grid-template-columns:76px 1fr;gap:.9rem;padding:.9rem 0;border-bottom:1px solid var(--g2)}.ln .ph{aspect-ratio:4/5}.ln h4{margin:0;font-size:.9rem}.qty{display:inline-flex;border:2px solid var(--g2)}.qty button{width:2rem;height:2rem}.qty button:hover{background:#000;color:#fff}.qty span{min-width:2rem;display:grid;place-items:center;font-weight:700}
.row{display:flex;justify-content:space-between;gap:1rem}.row.t{font:800 1.1rem var(--f)}.bar{height:5px;background:var(--g2)}.bar i{display:block;height:100%;background:#000;transition:width .5s}
#menu a{display:block;padding:.9rem 1.2rem;border-bottom:1px solid var(--g2);font:800 .95rem var(--f);text-transform:uppercase;text-decoration:none}
/* formulaires */
label.l{display:block;font:700 .78rem var(--f);margin:0 0 .3rem}.f{margin-bottom:.9rem}.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem}
input.i,select.i,textarea.i{width:100%;padding:.8rem .9rem;border:2px solid var(--g2);font:inherit;background:#fff;border-radius:0;color:inherit}input.i:focus,select.i:focus{outline:none;border-color:#000}input.bad{border-color:var(--red)}
.chk{display:flex;gap:.6rem;align-items:flex-start;font-size:.88rem;margin:.4rem 0;cursor:pointer}.chk input{width:1.1rem;height:1.1rem;margin-top:.15rem;accent-color:#000}
.err{color:var(--red);font-weight:700;font-size:.85rem;margin:.3rem 0;min-height:1.2em}.ok{font-weight:700}
.notice{border:2px solid #000;padding:.8rem 1rem;font-size:.86rem;margin-bottom:1rem}.notice.k{background:#000;color:#fff}
.co{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(1.2rem,4vw,3.5rem);padding:1.2rem 0 3rem;align-items:start}.steps{display:flex;gap:.5rem;margin-bottom:1.4rem;font:800 .78rem var(--f);text-transform:uppercase}.steps span{flex:1;padding:.6rem 0;border-bottom:4px solid var(--g2);color:var(--g5)}.steps span.on{border-color:#000;color:#000}
.co h2{font:900 1.6rem var(--f);font-stretch:70%;text-transform:uppercase;margin:0 0 1rem}.sum{position:sticky;top:7rem;background:var(--g1);padding:1.3rem;display:grid;gap:.7rem}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;border:2px solid var(--g2);padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer}.opt:has(input:checked){border-color:#000;background:var(--g1)}.opt input{accent-color:#000;width:1.1rem;height:1.1rem}
.card-in{position:relative}.cb{position:absolute;right:.8rem;top:2.2rem;font:800 .72rem var(--f);text-transform:uppercase;color:var(--g5)}
.mini{display:grid;grid-template-columns:48px 1fr auto;gap:.7rem;align-items:center;font-size:.86rem}.mini .ph{aspect-ratio:4/5}.mini .q{position:absolute;top:-5px;right:-5px;background:#000;color:#fff;border-radius:99px;min-width:1.2rem;height:1.2rem;font:700 .68rem/1.2rem var(--f);text-align:center}
.auth{max-width:440px;margin:0 auto;padding:2rem 0 3rem}.auth h1{font:900 2.6rem var(--f);font-stretch:68%;text-transform:uppercase;margin-bottom:1rem}.acct{display:grid;grid-template-columns:210px 1fr;gap:2rem;padding:1rem 0 3rem}.side{display:grid;align-content:start}.side button,.side a{text-align:left;padding:.8rem 0;border-bottom:1px solid var(--g2);font:800 .8rem var(--f);text-transform:uppercase;text-decoration:none}.side .on{padding-left:.6rem;background:var(--g1)}
.oc{border:2px solid var(--g2);padding:1rem;margin-bottom:.8rem}.st{display:inline-block;background:#000;color:#fff;font:800 .66rem var(--f);text-transform:uppercase;padding:.2rem .5rem}.addr{border:2px solid var(--g2);padding:1rem;margin-bottom:.7rem}
.spin{width:2.2rem;height:2.2rem;border:3px solid var(--g2);border-top-color:#000;border-radius:50%;animation:rot .8s linear infinite;margin:1rem auto}@keyframes rot{to{transform:rotate(360deg)}}
#toasts{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);z-index:90;display:grid;gap:.4rem}.toast{background:#000;color:#fff;padding:.8rem 1.2rem;font-weight:700;animation:rise .4s var(--ease) both}.toast.bad{background:var(--red)}
.empty{text-align:center;padding:3rem 1rem;display:grid;gap:1rem;justify-items:center}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.scroll{grid-auto-columns:minmax(200px,30%)}.rea{grid-template-columns:repeat(2,1fr)}.fg{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.hbar{grid-template-columns:auto 1fr auto;gap:.5rem}.burger{display:grid}.search{grid-column:1/-1;grid-row:2;max-width:none}.hbar .logo{justify-self:center;font-size:1.5rem}nav.cats{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.scroll{grid-auto-columns:minmax(160px,58%)}.tiles{grid-template-columns:1fr}.tile{aspect-ratio:21/9}.brandrow{grid-template-columns:repeat(2,1fr)}.pd,.co,.acct,.news .wrap{grid-template-columns:1fr}.sum{position:static}.side{display:flex;overflow-x:auto;gap:.4rem}.side button,.side a{border:2px solid var(--g2);padding:.5rem .9rem;white-space:nowrap}.cols{grid-template-columns:1fr}.top{gap:.4rem 1rem;font-size:.72rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="top" id="top"></div>
<header>
  <div class="hbar">
    <div style="display:flex;align-items:center;gap:.4rem"><button class="ib burger" id="burger" aria-label="Menu"></button><a class="logo" id="logo" href="#/"></a></div>
    <form class="search" id="sf" role="search"><span id="sic"></span><input id="q" type="search" placeholder="Rechercher un vêtement, une marque…" aria-label="Rechercher" autocomplete="off"></form>
    <div class="ico"><a class="ib" id="acc" href="#/compte" aria-label="Mon compte"></a><a class="ib" id="favl" href="#/favoris" aria-label="Favoris"></a><button class="ib" id="cartb" aria-label="Panier"></button></div>
  </div>
  <nav class="cats" aria-label="Catégories"><ul id="nav"></ul></nav>
</header>
<main id="view"></main>
<footer id="foot"></footer>
<div id="veil"></div>
<aside class="drawer" id="menu" aria-label="Menu"></aside>
<aside class="drawer" id="cart" aria-label="Panier"></aside>
<div id="toasts" aria-live="polite"></div>

<script>
/* ===================================================================
   CONFIGURATION : tout ce que tu peux changer est ici.
   =================================================================== */
const CONFIG = Object.assign({
  shopName: 'NORD 51',
  topbar: ['Livraison gratuite dès 99 €', 'Satisfait ou remboursé sous 14 jours', 'Paiement sécurisé'],
  freeShippingFrom: 99,
  freeShippingAlways: false,
  shipping: { home: { label: 'Livraison à domicile', price: 4.9, delay: '2 à 4 jours ouvrés', carrierId: 'colissimo' },
              relay: { label: 'Point relais', price: 3.9, delay: '3 à 5 jours ouvrés', carrierId: 'mondialrelay' } },
  promoCodes: { BIENVENUE10: { type: 'percent', value: 10 }, LIVRAISON: { type: 'ship', value: 0 } },
  // Tous les paiements passent par Stripe Checkout côté serveur.
  checkoutUrl: '/api/stripe/checkout',
  paymentMode: 'stripe',
  hero: { image: '', title: 'Nouvelle saison', text: 'Vestes, doudounes et essentiels de la collection automne. Quantités limitées.', cta: 'Voir les top ventes', link: '#/top-ventes' },
  tiles: [ { title: 'Nouveautés', link: '#/nouveautes', image: '' }, { title: 'Basiques premium', link: '#/marque/Nike', image: '' }, { title: 'Promos', link: '#/promos', image: '' } ],
  categories: ['Sneakers', 'Chaussures', 'Vestes', 'Doudounes', 'Ensembles', 'Sweats', 'T-shirts', 'Pantalons'],
  brands: ['Nike', 'Adidas', 'Jordan', 'New Balance', 'Puma', 'ASICS', 'Reebok', 'Converse', 'Vans', 'Lacoste', 'Ralph Lauren', "Levi's", 'Tommy Hilfiger', 'The North Face', 'Carhartt WIP', 'Patagonia', 'Salomon', 'Hoka', 'On', 'New Era', 'Calvin Klein', 'Champion', 'Under Armour', 'Fila', 'Zara', 'Uniqlo'],
  // EXEMPLES à remplacer par tes vrais produits. img : lien d'une photo (ou chemin comme images/veste.jpg).
  products: []
}, window.SHOP_CONFIG || {});

/* ===================== Synchronisation serveur ===================== */
async function loadServerProducts() {
  try {
    const cfg = await fetch('/api/config', { cache: 'no-store' }).then(r => r.ok ? r.json() : null);
    if (cfg) { CONFIG.freeShippingAlways = !!cfg.freeShippingAlways; if(CONFIG.freeShippingAlways)CONFIG.topbar[0]='Livraison gratuite sur toute la boutique'; }
    CONFIG.paymentMode = 'stripe'; CONFIG.checkoutUrl = '/api/stripe/checkout';
    if (cfg && cfg.promoCodes) CONFIG.promoCodes = cfg.promoCodes;
    const response = await fetch('/api/products', { cache: 'no-store' });
    if (!response.ok) throw new Error('API indisponible');
    const rows = await response.json();
    CONFIG.products = rows.map(p => ({
      id: String(p.id),
      title: p.title || 'Vêtement',
      brand: p.brand || CONFIG.shopName,
      cat: p.category || 'Autres',
      price: Number(p.price) || 0,
      old: 0,
      sizes: p.size ? String(p.size).split(/[,/]/).map(s => s.trim()).filter(Boolean) : ['Unique'],
      img: p.photo || (p.photos||[])[0] || '',
      images: Array.isArray(p.photos) && p.photos.length ? p.photos : (p.photo ? [p.photo] : []),
      desc: p.description || '',
      color: p.color || '',
      condition: p.condition || '',
      stock: Number(p.stock ?? 1),
      top: 0,
      isNew: 1,
      createdAt: p.createdAt || ''
    }));
    if (pHasNoProducts()) CONFIG.products = [];
  } catch (e) {
    console.error('Impossible de charger les vêtements depuis le serveur.', e);
    CONFIG.products = [];
  }
}

  return h('div', { class: 'wrap' }, h('div', { class: 'ph-h' }, h('h1', {}, 'Bonjour ' + u.first)), h('div', { class: 'acct' }, side, body));
};

/* ===================== Routeur ===================== */
function route() {
  closeAll(); const [path] = (location.hash || '#/').slice(2).split('?'), seg = path.split('/').map(dec), v = $('#view'); let n;
  if (!path) n = V.home(); else if (seg[0] === 'top-ventes') n = V.list('top'); else if (seg[0] === 'nouveautes') n = V.list('new'); else if (seg[0] === 'promos') n = V.list('promo'); else if (seg[0] === 'boutique') n = V.list('shop');
  else if (seg[0] === 'c') n = V.list('cat', seg[1]); else if (seg[0] === 'marque') n = V.list('brand', seg[1]); else if (seg[0] === 'marques') n = V.brands(); else if (seg[0] === 'recherche') n = V.list('search', seg[1] || '');
  else if (seg[0] === 'p') n = V.product(seg[1]); else if (seg[0] === 'favoris') n = V.favs(); else if (seg[0] === 'checkout') n = V.checkout(); else if (seg[0] === 'confirmation') n = V.confirm(seg[1]);
  else if (seg[0] === 'connexion') n = V.login(); else if (seg[0] === 'inscription') n = V.register(); else if (seg[0] === 'compte') n = V.account(seg[1]); else if (seg[0] === 'page') n = V.page(seg[1]); else n = V.notfound();
  v.replaceChildren(n); scrollTo(0, 0); setActive();
}
addEventListener('hashchange', route); loadServerProducts().finally(() => { paint(); route(); });
</script>
